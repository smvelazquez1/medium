  <script>
    // Fade slideshow: auto-advances every 9.5s, click left/right half to step.
    (function () {
      var slides = document.querySelectorAll('.slideshow img');
      var i = 0, timer;
      function show(n) {
        slides[i].classList.remove('active');
        i = (n + slides.length) % slides.length;
        slides[i].classList.add('active');
      }
      function restart() {
        clearInterval(timer);
        timer = setInterval(function () { show(i + 1); }, 9500);
      }
      document.querySelector('.slide-nav.prev').onclick = function () { show(i - 1); restart(); };
      document.querySelector('.slide-nav.next').onclick = function () { show(i + 1); restart(); };
      restart();
    })();
  </script>
</body>
